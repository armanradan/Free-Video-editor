[workspace]
members = ["apps/web", "crates/media-core", "crates/media-gpu", "crates/media-web"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98.1"

[workspace.dependencies]
dioxus = { version = "=0.7.10", default-features = false }
js-sys = "=0.3.105"
media-core = { path = "crates/media-core" }
media-gpu = { path = "crates/media-gpu" }
media-web = { path = "crates/media-web" }
serde = { version = "=1.0.229", features = ["derive"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = "=0.3.105"
wgpu = "=30.0.1"
