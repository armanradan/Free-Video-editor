[package]
name = "converter-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["native", "minimal"] }
futures-channel.workspace = true
futures-util.workspace = true
futures-timer = "=3.0.4"
media-core.workspace = true
media-gpu.workspace = true
media-gpu-blitz.workspace = true
media-native = { path = "../../crates/media-native" }
rfd.workspace = true
ui.workspace = true
# Exact renderer ABI used by the pinned Blitz, not the processing device/API.
wgpu-blitz = { package = "wgpu", version = "=26.0.1", default-features = false }
# Match the pinned native renderer's event-loop ABI; no second windowing stack.
blitz-shell = { version = "=0.2.3", default-features = false }
winit = { version = "=0.30.13", default-features = false }

[dev-dependencies]
pollster.workspace = true
wgpu.workspace = true
