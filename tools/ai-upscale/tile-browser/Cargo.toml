[package]
name = "ai-upscale-tile-browser-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
media-web = { path = "../../../crates/media-web", features = ["gpu-setup-diagnostic"] }
media-core = { path = "../../../crates/media-core" }
wgpu = "=30.0.1"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = ["OffscreenCanvas", "console"] }
serde_json = "=1.0.151"
futures-channel = "=0.3.34"
