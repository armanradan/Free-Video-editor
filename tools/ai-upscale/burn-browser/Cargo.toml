[package]
name = "ai-upscale-burn-browser-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "wgpu", "webgpu"] }
burn-store = { version = "=0.22.1", default-features = false, features = ["std"] }
media-web = { path = "../../../crates/media-web", features = ["gpu-setup-diagnostic"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = ["OffscreenCanvas", "console"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
